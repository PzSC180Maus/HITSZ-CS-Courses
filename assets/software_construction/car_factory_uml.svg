<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .interface-box { fill: #e8f4f8; stroke: #333; stroke-width: 2; }
      .class-box { fill: #fffacd; stroke: #333; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .text-method { font-family: Arial, sans-serif; font-size: 12px; }
      .stereotype { font-family: Arial, sans-serif; font-size: 11px; font-style: italic; fill: #333; }
      .line { stroke: #333; stroke-width: 2; fill: none; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashedline { stroke: #333; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
      .implements-arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead-impl); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-impl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="text-title" font-size="18">汽车工厂模式 UML 类图</text>

  <!-- ===== Top Row: Interfaces ===== -->
  
  <!-- CarFactory Interface (Left-Top) -->
  <rect x="50" y="80" width="240" height="120" class="interface-box"/>
  <line x1="50" y1="105" x2="290" y2="105" class="line"/>
  <text x="170" y="100" text-anchor="middle" class="stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="170" y="120" text-anchor="middle" class="text-title">CarFactory</text>
  <line x1="50" y1="125" x2="290" y2="125" class="line"/>
  <text x="60" y="145" class="text-method">+ createCar(): Car</text>

  <!-- Car Interface (Right-Top) -->
  <rect x="450" y="80" width="240" height="120" class="interface-box"/>
  <line x1="450" y1="105" x2="690" y2="105" class="line"/>
  <text x="570" y="100" text-anchor="middle" class="stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="570" y="120" text-anchor="middle" class="text-title">Car</text>
  <line x1="450" y1="125" x2="690" y2="125" class="line"/>
  <text x="460" y="145" class="text-method">+ drive(): void</text>
  <text x="460" y="162" class="text-method">+ getInfo(): String</text>

  <!-- ===== Middle Row: Concrete Factories ===== -->

  <!-- SedanFactory -->
  <rect x="30" y="280" width="200" height="100" class="class-box"/>
  <line x1="30" y1="305" x2="230" y2="305" class="line"/>
  <text x="130" y="325" text-anchor="middle" class="text-title">SedanFactory</text>
  <line x1="30" y1="330" x2="230" y2="330" class="line"/>
  <text x="40" y="350" class="text-method">+ createCar(): Car</text>

  <!-- SUVFactory -->
  <rect x="300" y="280" width="200" height="100" class="class-box"/>
  <line x1="300" y1="305" x2="500" y2="305" class="line"/>
  <text x="400" y="325" text-anchor="middle" class="text-title">SUVFactory</text>
  <line x1="300" y1="330" x2="500" y2="330" class="line"/>
  <text x="310" y="350" class="text-method">+ createCar(): Car</text>

  <!-- SportsCarFactory -->
  <rect x="570" y="280" width="200" height="100" class="class-box"/>
  <line x1="570" y1="305" x2="770" y2="305" class="line"/>
  <text x="670" y="325" text-anchor="middle" class="text-title">SportsCarFactory</text>
  <line x1="570" y1="330" x2="770" y2="330" class="line"/>
  <text x="580" y="350" class="text-method">+ createCar(): Car</text>

  <!-- ===== Middle Row: Concrete Products ===== -->

  <!-- Sedan -->
  <rect x="850" y="280" width="200" height="100" class="class-box"/>
  <line x1="850" y1="305" x2="1050" y2="305" class="line"/>
  <text x="950" y="325" text-anchor="middle" class="text-title">Sedan</text>
  <line x1="850" y1="330" x2="1050" y2="330" class="line"/>
  <text x="860" y="350" class="text-method">+ drive(): void</text>
  <text x="860" y="367" class="text-method">+ getInfo(): String</text>

  <!-- SUV -->
  <rect x="850" y="450" width="200" height="100" class="class-box"/>
  <line x1="850" y1="475" x2="1050" y2="475" class="line"/>
  <text x="950" y="495" text-anchor="middle" class="text-title">SUV</text>
  <line x1="850" y1="520" x2="1050" y2="520" class="line"/>
  <text x="860" y="540" class="text-method">+ drive(): void</text>

  <!-- SportsCar -->
  <rect x="850" y="620" width="200" height="100" class="class-box"/>
  <line x1="850" y1="645" x2="1050" y2="645" class="line"/>
  <text x="950" y="665" text-anchor="middle" class="text-title">SportsCar</text>
  <line x1="850" y1="690" x2="1050" y2="690" class="line"/>
  <text x="860" y="710" class="text-method">+ drive(): void</text>

  <!-- ===== Relationships ===== -->

  <!-- SedanFactory implements CarFactory -->
  <path d="M 130 280 L 130 200" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>
  <text x="150" y="240" class="text-method" font-size="10">implements</text>

  <!-- SUVFactory implements CarFactory -->
  <path d="M 400 280 L 170 200" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>
  <text x="270" y="240" class="text-method" font-size="10">implements</text>

  <!-- SportsCarFactory implements CarFactory -->
  <path d="M 670 280 L 170 200" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>
  <text x="350" y="240" class="text-method" font-size="10">implements</text>

  <!-- Sedan implements Car -->
  <path d="M 850 330 L 690 130" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>
  <text x="780" y="200" class="text-method" font-size="10">implements</text>

  <!-- SUV implements Car -->
  <path d="M 900 450 L 600 200" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>

  <!-- SportsCar implements Car -->
  <path d="M 920 620 L 620 200" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>

  <!-- SedanFactory creates Sedan -->
  <path d="M 230 330 L 850 330" class="dashedline"/>
  <text x="510" y="320" class="text-method" font-size="10" text-anchor="middle">creates</text>

  <!-- SUVFactory creates SUV -->
  <path d="M 500 330 L 850 500" class="dashedline"/>
  <text x="650" y="410" class="text-method" font-size="10" text-anchor="middle">creates</text>

  <!-- SportsCarFactory creates SportsCar -->
  <path d="M 770 330 L 870 620" class="dashedline"/>
  <text x="810" y="480" class="text-method" font-size="10" text-anchor="middle">creates</text>

  <!-- ===== Legend ===== -->
  <text x="50" y="760" class="text-method" font-size="11">
    <tspan x="50">图例：实线+空心箭头 (⊲|) = 接口实现；虚线 = 创建关系</tspan>
  </text>
</svg>