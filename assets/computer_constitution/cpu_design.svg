<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="550" fill="#ffffff" />
  
  <!-- CPU 框图 -->
  <rect x="40" y="60" width="160" height="420" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="50" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">CPU (16位地址, 8位数据)</text>
  
  <!-- CPU 引脚 -->
  <text x="190" y="90" font-size="14" text-anchor="end">A15</text>
  <text x="190" y="130" font-size="14" text-anchor="end">A14</text>
  <text x="190" y="160" font-size="14" text-anchor="end">A13</text>
  <text x="190" y="190" font-size="14" text-anchor="end">A12</text>
  <text x="190" y="250" font-size="14" text-anchor="end">A11...A0</text>
  <text x="190" y="320" font-size="14" text-anchor="end">D7...D0</text>
  <text x="190" y="380" font-size="14" text-anchor="end">MREQ (低)</text><line x1="145" y1="368" x2="188" y2="368" stroke="black" />
  <text x="190" y="420" font-size="14" text-anchor="end">R/W</text><line x1="175" y1="408" x2="188" y2="408" stroke="black" />

  <!-- 74138 译码器 -->
  <rect x="300" y="60" width="110" height="150" fill="none" stroke="black" stroke-width="2" />
  <text x="355" y="50" font-size="14" font-weight="bold" text-anchor="middle">74138</text>
  <text x="305" y="80" font-size="12">G1</text>
  <text x="305" y="100" font-size="12">G2A</text><circle cx="296" cy="96" r="3" fill="none" stroke="black" />
  <text x="305" y="120" font-size="12">G2B</text><circle cx="296" cy="116" r="3" fill="none" stroke="black" />
  <text x="305" y="145" font-size="12">C</text>
  <text x="305" y="170" font-size="12">B</text>
  <text x="305" y="195" font-size="12">A</text>
  
  <text x="405" y="90" font-size="12" text-anchor="end">Y0</text><circle cx="414" cy="86" r="3" fill="none" stroke="black" />
  <text x="405" y="120" font-size="12" text-anchor="end">Y1</text><circle cx="414" cy="116" r="3" fill="none" stroke="black" />
  <text x="405" y="150" font-size="12" text-anchor="end">Y2</text><circle cx="414" cy="146" r="3" fill="none" stroke="black" />
  <text x="405" y="180" font-size="12" text-anchor="end">Y3</text><circle cx="414" cy="176" r="3" fill="none" stroke="black" />

  <!-- 译码器连线 -->
  <path d="M 200 90 L 260 90 L 260 96 L 293 96" fill="none" stroke="black" /> <!-- A15 to G2A -->
  <path d="M 200 380 L 280 380 L 280 116 L 293 116" fill="none" stroke="black" /> <!-- MREQ to G2B -->
  <line x1="280" y1="76" x2="296" y2="76" stroke="black" /> <text x="255" y="78" font-size="12">Vcc</text>
  <path d="M 200 130 L 300 145" stroke="black" /> <!-- A14 to C -->
  <path d="M 200 160 L 300 170" stroke="black" /> <!-- A13 to B -->
  <path d="M 200 190 L 300 195" stroke="black" /> <!-- A12 to A -->

  <!-- 存储芯片：ROM (位扩展) -->
  <rect x="250" y="270" width="100" height="70" fill="#f0f0f0" stroke="black" />
  <text x="300" y="295" font-size="10" text-anchor="middle">ROM 1</text>
  <text x="300" y="315" font-size="11" font-weight="bold" text-anchor="middle">4K x 4位</text>
  
  <rect x="360" y="270" width="100" height="70" fill="#f0f0f0" stroke="black" />
  <text x="410" y="295" font-size="10" text-anchor="middle">ROM 2</text>
  <text x="410" y="315" font-size="11" font-weight="bold" text-anchor="middle">4K x 4位</text>

  <!-- 存储芯片：RAM -->
  <rect x="480" y="270" width="90" height="70" fill="none" stroke="black" />
  <text x="525" y="305" font-size="11" font-weight="bold" text-anchor="middle">RAM1 (4Kx8)</text>
  
  <rect x="580" y="270" width="90" height="70" fill="none" stroke="black" />
  <text x="625" y="305" font-size="11" font-weight="bold" text-anchor="middle">RAM2 (4Kx8)</text>

  <rect x="680" y="270" width="90" height="70" fill="none" stroke="black" />
  <text x="725" y="305" font-size="11" font-weight="bold" text-anchor="middle">RAM3 (4Kx8)</text>

  <!-- 地址总线 A11-A0 -->
  <line x1="200" y1="250" x2="750" y2="250" stroke="black" stroke-width="2" />
  <text x="760" y="255" font-size="12">A11~A0</text>
  <path d="M 300 250 L 300 270 M 410 250 L 410 270 M 525 250 L 525 270 M 625 250 L 625 270 M 725 250 L 725 270" stroke="black" />

  <!-- 数据总线 D7-D0 -->
  <line x1="200" y1="450" x2="750" y2="450" stroke="blue" stroke-width="2" />
  <text x="760" y="455" font-size="12" fill="blue">D7~D0</text>
  <!-- ROM 数据连接 (位扩展) -->
  <path d="M 300 340 L 300 450" stroke="blue" marker-end="url(#arrow_u)" /> <text x="305" y="440" font-size="9" fill="blue">D3~D0</text>
  <path d="M 410 340 L 410 450" stroke="blue" marker-end="url(#arrow_u)" /> <text x="415" y="440" font-size="9" fill="blue">D7~D4</text>
  <!-- RAM 数据连接 -->
  <path d="M 525 340 L 525 450" stroke="blue" marker-start="url(#arrow_d)" marker-end="url(#arrow_u)" />
  <path d="M 625 340 L 625 450" stroke="blue" marker-start="url(#arrow_d)" marker-end="url(#arrow_u)" />
  <path d="M 725 340 L 725 450" stroke="blue" marker-start="url(#arrow_d)" marker-end="url(#arrow_u)" />

  <!-- 片选信号 CS -->
  <path d="M 417 86 L 450 86 L 450 230 L 305 230 L 305 270" fill="none" stroke="black" /> <!-- Y0 to ROMs -->
  <line x1="305" y1="230" x2="410" y2="230" stroke="black" /> <line x1="410" y1="230" x2="410" y2="270" stroke="black" />
  <path d="M 417 116 L 525 116 L 525 270" fill="none" stroke="black" /> <!-- Y1 to RAM1 -->
  <path d="M 417 146 L 625 146 L 625 270" fill="none" stroke="black" /> <!-- Y2 to RAM2 -->
  <path d="M 417 176 L 725 176 L 725 270" fill="none" stroke="black" /> <!-- Y3 to RAM3 -->

  <!-- 写信号 R/W -->
  <path d="M 200 420 L 725 420" stroke="red" stroke-dasharray="4" />
  <path d="M 525 420 L 525 340 M 625 420 L 625 340 M 725 420 L 725 340" stroke="red" stroke-dasharray="2" />
  <text x="735" y="415" font-size="12" fill="red">R/W (WE)</text>

  <!-- 箭头 -->
  <defs>
    <marker id="arrow_u" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="270"><polygon points="0 0, 10 3.5, 0 7" fill="blue"/></marker>
    <marker id="arrow_d" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="90"><polygon points="0 0, 10 3.5, 0 7" fill="blue"/></marker>
  </defs>

  <!-- 文字说明 -->
  <text x="50" y="520" font-size="12" fill="#333">注：ROM区由2片4Kx4位芯片位扩展组成(0000H-0FFFH)，RAM区由3片4Kx8位芯片组成(1000H-3FFFH)。</text>
</svg>