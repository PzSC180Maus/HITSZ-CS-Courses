<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .interface-box { fill: #e8f4f8; stroke: #333; stroke-width: 2; }
      .class-box { fill: #fffacd; stroke: #333; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .text-method { font-family: Arial, sans-serif; font-size: 12px; }
      .stereotype { font-family: Arial, sans-serif; font-size: 11px; font-style: italic; fill: #333; }
      .line { stroke: #333; stroke-width: 2; fill: none; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashedline { stroke: #333; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
      .implements-arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead-impl); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-impl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="text-title" font-size="18">观察者模式 UML 类图</text>

  <!-- ===== Interfaces ===== -->

  <!-- Subject Interface -->
  <rect x="50" y="80" width="240" height="140" class="interface-box"/>
  <line x1="50" y1="105" x2="290" y2="105" class="line"/>
  <text x="170" y="100" text-anchor="middle" class="stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="170" y="120" text-anchor="middle" class="text-title">Subject</text>
  <line x1="50" y1="125" x2="290" y2="125" class="line"/>
  <text x="60" y="145" class="text-method">+ attach(observer: Observer)</text>
  <text x="60" y="162" class="text-method">+ detach(observer: Observer)</text>
  <text x="60" y="179" class="text-method">+ notify()</text>

  <!-- Observer Interface -->
  <rect x="600" y="80" width="240" height="100" class="interface-box"/>
  <line x1="600" y1="105" x2="840" y2="105" class="line"/>
  <text x="720" y="100" text-anchor="middle" class="stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="720" y="120" text-anchor="middle" class="text-title">Observer</text>
  <line x1="600" y1="125" x2="840" y2="125" class="line"/>
  <text x="610" y="145" class="text-method">+ update()</text>

  <!-- ===== Concrete Classes ===== -->

  <!-- Sensor (Subject) -->
  <rect x="50" y="300" width="200" height="140" class="class-box"/>
  <line x1="50" y1="325" x2="250" y2="325" class="line"/>
  <text x="150" y="345" text-anchor="middle" class="text-title">Sensor</text>
  <line x1="50" y1="350" x2="250" y2="350" class="line"/>
  <text x="60" y="370" class="text-method">- temperature</text>
  <text x="60" y="387" class="text-method">- observers: List</text>
  <line x1="50" y1="395" x2="250" y2="395" class="line"/>
  <text x="60" y="415" class="text-method">+ setTemperature()</text>

  <!-- AirConditioner (Observer) -->
  <rect x="350" y="300" width="200" height="100" class="class-box"/>
  <line x1="350" y1="325" x2="550" y2="325" class="line"/>
  <text x="450" y="345" text-anchor="middle" class="text-title">AirConditioner</text>
  <line x1="350" y1="350" x2="550" y2="350" class="line"/>
  <text x="360" y="370" class="text-method">+ update()</text>
  <text x="360" y="387" class="text-method">+ turnOn()</text>

  <!-- Curtain (Observer) -->
  <rect x="650" y="300" width="200" height="100" class="class-box"/>
  <line x1="650" y1="325" x2="850" y2="325" class="line"/>
  <text x="750" y="345" text-anchor="middle" class="text-title">Curtain</text>
  <line x1="650" y1="350" x2="850" y2="350" class="line"/>
  <text x="660" y="370" class="text-method">+ update()</text>
  <text x="660" y="387" class="text-method">+ close()</text>

  <!-- ===== Relationships ===== -->

  <!-- Sensor implements Subject -->
  <path d="M 150 300 L 170 220" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>

  <!-- AirConditioner implements Observer -->
  <path d="M 450 300 L 700 180" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>

  <!-- Curtain implements Observer -->
  <path d="M 750 300 L 750 180" class="implements-arrow" marker-end="url(#arrowhead-impl)"/>

  <!-- Subject has Observers (aggregation) -->
  <path d="M 290 150 L 600 150" class="arrow"/>
  <text x="420" y="140" class="text-method" font-size="10" text-anchor="middle">observes</text>
  <text x="430" y="165" class="text-method" font-size="10" text-anchor="middle">1..* observers</text>

  <!-- Legend -->
  <text x="50" y="520" class="text-method" font-size="11" font-weight="bold">核心关系说明：</text>
  <text x="50" y="545" class="text-method" font-size="11">
    <tspan x="50">• 当 Sensor（Subject）检测到温度升高时，调用 notify() 通知所有观察者</tspan>
  </text>
  <text x="50" y="565" class="text-method" font-size="11">
    <tspan x="50">• AirConditioner 和 Curtain 分别实现 Observer 接口的 update() 方法</tspan>
  </text>
  <text x="50" y="585" class="text-method" font-size="11">
    <tspan x="50">• 实线空心箭头 (⊲|) = 接口实现；实线箭头 = 聚合/关联关系</tspan>
  </text>
</svg>